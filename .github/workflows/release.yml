# Paquets installables (Lot 7) : NSIS + MSI + zip portable (Windows), deb + AppImage (Linux),
# dmg (macOS, Apple Silicon). Déclenché par une étiquette `v*` ou à la main ; les fichiers
# sont joints à une release GitHub **brouillon**, publiée ensuite à la main.
# Paquets non signés : avertissement SmartScreen (Windows) et Gatekeeper (macOS) attendus.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: release brouillon
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        name: Créer (ou retrouver) la release brouillon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "MegaUltraPDF $TAG" \
              --notes "Paquets non signés : Windows affiche un avertissement SmartScreen (« Informations complémentaires » puis « Exécuter quand même ») et macOS demande une ouverture via clic droit > Ouvrir. Licences tierces : THIRD_PARTY_LICENSES.md."
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: paquets (${{ matrix.os }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-latest
            bundles: dmg
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm --dir app install --frozen-lockfile

      - name: PDFium (version épinglée, somme vérifiée)
        run: cargo xtask fetch-pdfium

      - name: Construire les paquets
        # `release` = `tauri build --config src-tauri/tauri.release.conf.json` : prépare PDFium
        # (`cargo xtask stage-pdfium`) et l'embarque dans les ressources.
        run: pnpm --dir app release --bundles ${{ matrix.bundles }}

      - name: Zip portable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./app/package.json').version"
          $dir = "MegaUltraPDF-$version-portable"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/mega-app.exe "$dir/MegaUltraPDF.exe"
          Copy-Item app/src-tauri/resources/pdfium/pdfium.dll $dir
          Copy-Item app/src-tauri/resources/pdfium/LICENSE "$dir/PDFIUM-LICENSE.txt"
          Copy-Item THIRD_PARTY_LICENSES.md, LICENSE $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "MegaUltraPDF_${version}_x64_portable.zip"

      - name: Joindre à la release brouillon
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi \
                 target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage \
                 target/release/bundle/dmg/*.dmg MegaUltraPDF_*_portable.zip)
          if [ ${#files[@]} -eq 0 ]; then echo "aucun paquet produit"; exit 1; fi
          gh release upload "${{ needs.draft.outputs.tag }}" "${files[@]}" --clobber
