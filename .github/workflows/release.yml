# Paquets installables (Lot 7) : NSIS + MSI + zip portable (Windows), deb + AppImage (Linux),
# dmg (macOS, Apple Silicon). Déclenché par une étiquette `v*` ou à la main ; les fichiers
# sont joints à une release GitHub **brouillon**, publiée ensuite à la main.
# Paquets non signés : avertissement SmartScreen (Windows) et Gatekeeper (macOS) attendus.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Droits minimaux par défaut : seuls les jobs `draft` et `publish`, qui n'exécutent aucune
# action tierce, peuvent écrire dans les releases. Les actions tierces sont épinglées par
# empreinte de commit (le commentaire donne l'étiquette suivie).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: release brouillon
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        name: Créer (ou retrouver) la release brouillon
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          TAG="v$VERSION"
          # Une étiquette poussée doit correspondre à la version du code construit.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::étiquette $GITHUB_REF_NAME différente de la version $TAG (app/package.json)"
            exit 1
          fi
          # Jamais de modification d'une release déjà publiée (les binaires téléchargés
          # par les utilisateurs ne doivent pas changer en silence).
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" != "true" ]; then
              echo "::error::la release $TAG est déjà publiée : refus de la modifier"
              exit 1
            fi
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "MegaUltraPDF $TAG" \
              --notes "Paquets non signés : Windows affiche un avertissement SmartScreen (« Informations complémentaires » puis « Exécuter quand même ») et macOS demande une ouverture via clic droit > Ouvrir. Microsoft Defender peut signaler l'installeur comme Trojan:Win32/Bearfoos.A!ml : c'est un faux positif (détection statistique d'un installeur non signé et encore inconnu), voir la section « Microsoft Defender » du README. Licences tierces : THIRD_PARTY_LICENSES.md."
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: paquets (${{ matrix.os }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-latest
            bundles: dmg
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm --dir app install --frozen-lockfile

      - name: PDFium (version épinglée, somme vérifiée)
        run: cargo xtask fetch-pdfium

      - name: Construire les paquets
        # `release` = `tauri build --config src-tauri/tauri.release.conf.json` : prépare PDFium
        # (`cargo xtask stage-pdfium`) et l'embarque dans les ressources.
        run: pnpm --dir app release --bundles ${{ matrix.bundles }}

      - name: Zip portable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./app/package.json').version"
          $dir = "MegaUltraPDF-$version-portable"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/mega-app.exe "$dir/MegaUltraPDF.exe"
          Copy-Item app/src-tauri/resources/pdfium/pdfium.dll $dir
          Copy-Item app/src-tauri/resources/pdfium/LICENSE "$dir/PDFIUM-LICENSE.txt"
          Copy-Item THIRD_PARTY_LICENSES.md, LICENSE $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "MegaUltraPDF_${version}_x64_portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: paquets-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            MegaUltraPDF_*_portable.zip

  publish:
    name: joindre à la release brouillon
    needs: [draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: paquets-*
          merge-multiple: true
          path: paquets
      - name: Téléverser
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.draft.outputs.tag }}"
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" != "true" ]; then
            echo "::error::la release $TAG n'est plus un brouillon : téléversement refusé"
            exit 1
          fi
          # download-artifact recrée l'arborescence (target/release/bundle/…) : on téléverse
          # chaque fichier trouvé, pas les dossiers.
          mapfile -t files < <(find paquets -type f)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::aucun paquet à téléverser"; exit 1; fi
          printf '%s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
