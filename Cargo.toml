[workspace]
resolver = "3"
members = ["crates/*", "xtask", "app/src-tauri"]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.90"

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
