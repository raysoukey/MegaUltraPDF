[package]
name = "mega-app"
description = "MegaUltraPDF : application de bureau (backend Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# Tauri construit l'application comme une bibliothèque (`lib.rs`, fonction `run`)
# appelée par un binaire minuscule (`main.rs`) : c'est ce qui permet de viser aussi
# le mobile plus tard. Le suffixe `_lib` évite un conflit de nom sous Windows.
name = "mega_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mega-core = { path = "../../crates/mega-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
thiserror.workspace = true
percent-encoding = "2"

[dev-dependencies]
serde_json = "1"
mega-core = { path = "../../crates/mega-core", features = ["testing"] }
