[package]
name = "mega-cli"
description = "Outil en ligne de commande de MegaUltraPDF"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mega"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
mega-core = { path = "../mega-core" }
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
# Affichage des dates de signature (`mega signatures`) ; déjà dans l'arbre via mega-core.
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[features]
# Le produit livré contient les options de `mega-core` (désactivées par défaut dans la bibliothèque).
default = ["ocr", "signature"]
ocr = ["mega-core/ocr"]
signature = ["mega-core/signature", "dep:chrono"]
