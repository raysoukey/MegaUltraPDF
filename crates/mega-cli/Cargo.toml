[package]
name = "mega-cli"
description = "Outil en ligne de commande de MegaUltraPDF"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mega"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
mega-core = { path = "../mega-core" }
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
