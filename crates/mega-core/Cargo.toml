[package]
name = "mega-core"
description = "Cœur de MegaUltraPDF : toute la logique PDF, sans interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints.rust]
unsafe_code = "forbid"

[features]
# Génération de PDF d'exemple pour les tests (utilisée aussi par xtask et l'app en tests).
testing = []

[dependencies]
pdfium-render = "0.9.4"
# png : rendu ; jpeg : images de signature fournies par l'utilisateur.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde.workspace = true
thiserror.workspace = true
tempfile = "3"
# Dates des annotations (`set_creation_date`) ; déjà dans l'arbre via pdfium-render.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Écriture directe des dictionnaires PDF que pdfium-render ne sait pas écrire correctement
# (`/V`, `/AS` en noms, `/NeedAppearances`, retrait de `/AcroForm`) : ADR-0003 et ADR-0009.
lopdf = "0.46.0"

[dev-dependencies]
mega-core = { path = ".", features = ["testing"] }
