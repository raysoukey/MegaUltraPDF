[package]
name = "xtask"
description = "Tâches de développement de MegaUltraPDF (cargo xtask ...)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow.workspace = true
mega-core = { path = "../crates/mega-core", features = ["testing"] }
serde.workspace = true
serde_json.workspace = true
toml = "0.9"
ureq = "3"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
# Lot 12 : découpe des icônes et réduction du logo et de la bannière (`cargo xtask brand`).
# Déjà dans l'arbre via mega-core ; png pour lire et écrire, jpeg pour la bannière du README.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
